[workspace]
members = ["crates/sampler-core", "crates/sampler-audio", "crates/sampler-tui"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
crossterm = "0.29.0"
cpal = "0.18.1"
getrandom = "0.3.4"
ratatui = "=0.30.2"
rtrb = "0.3.4"
rubato = "4.0.0"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
symphonia = { version = "0.6.0", default-features = false, features = ["wav", "aiff", "flac", "mp3", "pcm"] }
thiserror = "2.0.19"
toml = "1.1.4"
